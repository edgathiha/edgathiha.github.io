<head>

  <style>
    :root {
      --bg-void: #030508;
      --bg-surface: #070c12;
      --bg-card: #05090e;
      --accent-cyan: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --accent-glow-strong: rgba(0, 240, 255, 0.65);
      --text-primary: #eaf6f8;
      --text-muted: #9eb3be;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at top, #0a1924, var(--bg-void));
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    header {
      height: 320px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }

    header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.28;
      filter: hue-rotate(180deg) saturate(1.2);
    }

    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(4px);
      padding: 0 20px;
    }
